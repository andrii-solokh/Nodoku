<!DOCTYPE html>
<html lang="en">
		<head>
			<meta charset="utf-8">
			<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
			<title>Nodoku</title>
			<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #8efaaa;
	background: radial-gradient(1200px 700px at 50% 35%, #0a2415 0%, #05140d 50%, #020b07 100%);
	overflow: hidden;
	touch-action: none;
	font-family: "Menlo", "Monaco", "Consolas", "Courier New", monospace;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	backdrop-filter: blur(2px);
}

#status-card {
	width: min(560px, 88vw);
	padding: 24px 24px 18px;
	border: 2px solid rgba(91, 226, 125, 0.85);
	border-radius: 20px;
	background: linear-gradient(180deg, rgba(3, 20, 13, 0.92), rgba(1, 12, 8, 0.96));
	box-shadow:
		0 18px 60px rgba(0, 0, 0, 0.45),
		0 0 56px rgba(91, 226, 125, 0.18),
		inset 0 0 20px rgba(91, 226, 125, 0.07);
}

#status-topline {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
	margin-bottom: 10px;
}

#status-brand {
	font-size: clamp(34px, 5vw, 48px);
	line-height: 1.1;
	font-weight: 700;
	color: #c8ffd2;
	text-shadow: 0 0 20px rgba(142, 250, 170, 0.35);
}

#status-subtitle {
	font-size: clamp(14px, 2vw, 18px);
	color: #6bcf88;
	opacity: 0.9;
}

#status-pixels {
	display: grid;
	grid-template-columns: repeat(3, 12px);
	gap: 5px;
}

#status-pixels span {
	width: 12px;
	height: 12px;
	border: 2px solid #5be27d;
	background: rgba(91, 226, 125, 0.15);
	animation: nodokuPulse 1.2s ease-in-out infinite;
}

#status-pixels span:nth-child(2) { animation-delay: .15s; }
#status-pixels span:nth-child(3) { animation-delay: .30s; }

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	width: 100%;
	height: 14px;
	appearance: none;
	border: 1px solid rgba(91, 226, 125, 0.75);
	border-radius: 10px;
	background: rgba(4, 23, 14, 0.8);
	overflow: hidden;
	margin-top: 12px;
}

#status-progress::-webkit-progress-bar {
	background: rgba(4, 23, 14, 0.8);
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #49bc66, #8efaaa);
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #49bc66, #8efaaa);
}

#status-percent {
	margin-top: 10px;
	font-size: 16px;
	color: #8efaaa;
	text-align: right;
}

#status-notice {
	margin-top: 14px;
	background: rgba(76, 16, 16, 0.62);
	border: 1px solid rgba(255, 120, 120, 0.68);
	border-radius: 10px;
	color: #ffd7d7;
	line-height: 1.35;
	padding: 10px 12px;
	text-align: left;
	white-space: pre-line;
}

@keyframes nodokuPulse {
	0%, 100% { transform: scale(1.0); opacity: 0.45; }
	50% { transform: scale(1.08); opacity: 1; }
}
			</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020b07;}#canvas{width:100%;height:100%;display:block;}</style><script>(function(){function f(){var c=document.getElementById('canvas');if(!c)return;if(!c.hasAttribute('tabindex'))c.setAttribute('tabindex','0');if(document.activeElement!==c)c.focus();}function p(e){var k=e.key||'';var kl=k.toLowerCase();if(k.startsWith('Arrow')||kl==='w'||kl==='a'||kl==='s'||kl==='d'||k==='['||k===']'||k===' ')e.preventDefault();}window.addEventListener('pointerdown',f,true);window.addEventListener('mousedown',f,true);window.addEventListener('touchstart',f,{passive:true,capture:true});window.addEventListener('keydown',p,{passive:false,capture:true});window.addEventListener('keydown',f,true);})();</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

			<div id="status">
				<div id="status-card">
					<div id="status-topline">
						<div>
							<div id="status-brand">Nodoku</div>
							<div id="status-subtitle">Connect all nodes</div>
						</div>
						<div id="status-pixels" aria-hidden="true">
							<span></span><span></span><span></span>
						</div>
					</div>
					<progress id="status-progress"></progress>
					<div id="status-percent">Loading 0%</div>
					<div id="status-notice"></div>
				</div>
			</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":19009688,"index.wasm":37686550},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

	(function () {
		const statusOverlay = document.getElementById('status');
		const statusProgress = document.getElementById('status-progress');
		const statusNotice = document.getElementById('status-notice');
		const statusPercent = document.getElementById('status-percent');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
			statusOverlay.style.visibility = 'visible';
			statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
			statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
			if (statusPercent) {
				statusPercent.style.display = mode === 'progress' ? 'block' : 'none';
			}
			statusMode = mode;
		}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
						if (statusPercent) {
							const pct = Math.round((current / total) * 100);
							statusPercent.textContent = `Loading ${pct}%`;
						}
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
						if (statusPercent) {
							statusPercent.textContent = 'Loading...';
						}
					}
				},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
